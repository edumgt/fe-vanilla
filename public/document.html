<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스 문서분석 - EDUMGT</title>
  <link href="assets/css/default.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="cmmContainer"></div>
  <nav class="breadcrumb">뉴스 문서분석</nav>

  <div id="content">
    <div id="workarea" class="flex gap-4" style="height: calc(100vh - 120px);">
      <!-- 문서 리스트 사이드바 -->
      <div class="w-80 bg-white rounded-xl shadow-sm border p-4 flex flex-col">
        <div class="flex justify-between items-center pb-3 border-b">
          <h3 class="text-sm font-bold text-gray-700"><i class="fas fa-file-alt mr-2 text-blue-600"></i>문서 목록</h3>
        </div>
        <div id="document-list" class="flex-1 overflow-y-auto mt-2 space-y-1"></div>
        <div id="btn-area"></div>
      </div>

      <!-- 뷰어 영역 -->
      <div id="viewer" class="flex-1 bg-white rounded-xl shadow-sm border p-6 flex items-center justify-center">
        <div class="text-gray-400 text-sm">목록에서 문서를 선택하세요.</div>
      </div>
    </div>
  </div>

  <!-- 신규 문서 모달 -->
  <div id="new-document-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg w-96">
      <h4 class="text-base font-bold text-gray-800 mb-4">문서 업로드</h4>
      <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-blue-500">
        <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
        <p class="text-xs text-gray-500">파일을 드래그하거나 클릭하여 업로드</p>
        <input type="file" id="file-input" class="hidden" />
      </div>
      <div id="progress-bar" class="hidden mt-4 w-full bg-gray-200 rounded-full h-2">
        <div class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
      </div>
      <div id="closeBtn"></div>
    </div>
  </div>

  <script type="module" src="assets/js/logomodule.js"></script>
  <script type="module" src="assets/js/document.js"></script>
</body>
</html>
