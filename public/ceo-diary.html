<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO 다이어리 - EDUMGT</title>
  <link href="assets/css/default.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ceo-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ceo-card:hover, .ceo-card.active {
      border-color: #0058a3;
      background: #f0f7ff;
    }
    .ceo-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .filter-tab {
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      border: 1px solid #cbd5e0;
      background: #fff;
      color: #4a5568;
      cursor: pointer;
      font-weight: 600;
    }
    .filter-tab.active, .filter-tab:hover {
      background: #0058a3;
      color: #fff;
      border-color: #0058a3;
    }
    .timeline-item {
      position: relative;
      padding-left: 28px;
      padding-bottom: 20px;
      border-left: 2px solid #e2e8f0;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0058a3;
    }
  </style>
</head>
<body>
  <div id="cmmContainer"></div>
  <nav class="breadcrumb">CEO 다이어리</nav>

  <div id="content" class="relative">
    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="hidden absolute inset-0 bg-white/70 flex items-center justify-center z-40">
      <div class="text-sm font-semibold text-gray-600"><i class="fas fa-spinner fa-spin mr-2"></i>데이터 불러오는 중...</div>
    </div>

    <!-- 상단 CEO 목록 바 -->
    <div class="mb-4">
      <div class="text-xs font-semibold text-gray-500 mb-2">리더 선택</div>
      <div id="ceo-selector" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- CEO 프로필 헤더 카드 -->
    <div id="ceo-profile-header" class="bg-white rounded-xl shadow-sm border p-4 mb-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div id="profile-avatar" class="text-3xl"></div>
        <div>
          <div class="text-xs font-bold text-blue-600" id="profile-company"></div>
          <h2 class="text-lg font-bold text-gray-800" id="profile-name"></h2>
          <div class="text-xs text-gray-500" id="profile-title"></div>
        </div>
      </div>
      <div class="flex gap-4 text-center">
        <div class="px-3 py-1 bg-gray-50 rounded-lg border">
          <div class="text-xs text-gray-500">기록 뉴스</div>
          <div class="text-base font-bold text-gray-800" id="profile-news-count">0</div>
        </div>
        <div class="px-3 py-1 bg-gray-50 rounded-lg border">
          <div class="text-xs text-gray-500">관련 국가</div>
          <div class="text-base font-bold text-gray-800" id="profile-country-count">0</div>
        </div>
        <div class="px-3 py-1 bg-gray-50 rounded-lg border">
          <div class="text-xs text-gray-500">최근 활동</div>
          <div class="text-xs font-bold text-gray-700 mt-1" id="profile-latest-date">-</div>
        </div>
      </div>
    </div>

    <!-- 검색 & 필터 -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <div class="flex items-center gap-2" id="activity-filter-row"></div>
      <div class="flex items-center gap-2">
        <input type="text" id="diary-search" placeholder="활동/키워드 검색..." class="text-xs border rounded-lg px-3 py-1.5 w-52 outline-none focus:border-blue-500" />
        <span id="diary-count-label" class="text-xs text-gray-500"></span>
      </div>
    </div>

    <!-- 2열 그리드: 타임라인 & 통계 차트 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- 타임라인 -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border p-4">
        <h3 class="text-sm font-bold text-gray-700 mb-4"><i class="fas fa-stream mr-2 text-blue-600"></i>활동 타임라인</h3>
        <div id="diary-timeline"></div>
        <div id="diary-empty" class="hidden text-center py-10 text-gray-400 text-sm">해당 조건의 활동 기록이 없습니다.</div>
      </div>

      <!-- 통계 / 차트 -->
      <div class="space-y-4">
        <div class="bg-white rounded-xl shadow-sm border p-4">
          <h3 class="text-sm font-bold text-gray-700 mb-3"><i class="fas fa-chart-pie mr-2 text-blue-600"></i>활동 유형별 통계</h3>
          <canvas id="activity-chart" height="180"></canvas>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-4">
          <h3 class="text-sm font-bold text-gray-700 mb-3"><i class="fas fa-chart-bar mr-2 text-blue-600"></i>월별 활동 추이</h3>
          <canvas id="monthly-chart" height="160"></canvas>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-4">
          <h3 class="text-sm font-bold text-gray-700 mb-3"><i class="fas fa-globe mr-2 text-blue-600"></i>주요 방문/언급 국가</h3>
          <div id="country-stat-list" class="space-y-1.5 text-xs"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module" src="assets/js/logomodule.js"></script>
  <script type="module" src="assets/js/ceo-diary.js"></script>
</body>
</html>
