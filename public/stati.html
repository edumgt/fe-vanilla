<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시장통계 - EDUMGT</title>
  <link href="assets/css/default.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui-grid/latest/tui-grid.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/v3.4.0/tui-pagination.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pikaday/css/pikaday.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .search-input {
      height: 32px;
      font-size: 0.8rem;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      padding: 4px 8px;
      outline: none;
    }
    .search-input:focus {
      border-color: #0058a3;
    }
  </style>
</head>
<body>
  <div id="cmmContainer"></div>
  <nav class="breadcrumb">시장통계</nav>

  <div id="content">
    <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
      <div id="dataCount" class="text-sm font-bold text-gray-700">Total : 0</div>
      
      <div class="flex flex-wrap items-center gap-2">
        <input type="text" id="team" placeholder="Team" class="search-input" style="width: 130px;" />
        <input type="text" id="name" placeholder="Name" class="search-input" style="width: 130px;" />
        <input type="text" id="email" placeholder="Email" class="search-input" style="width: 150px;" />
        <div class="relative inline-flex items-center">
          <input type="text" id="datePicker" placeholder="YYYY-MM-DD" class="search-input" style="width: 120px;" />
          <i class="far fa-calendar-alt absolute right-2 text-gray-400 pointer-events-none text-xs"></i>
        </div>

        <div id="btnContainer" class="flex items-center"></div>
      </div>
    </div>

    <div id="workarea" class="w-full">
      <div class="col-span-full">
        <div id="grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pikaday/pikaday.js"></script>
  <script src="https://uicdn.toast.com/tui.pagination/v3.4.0/tui-pagination.min.js"></script>
  <script src="https://uicdn.toast.com/tui-grid/latest/tui-grid.js"></script>
  <script>
    window.btnContainer = document.getElementById('btnContainer');
  </script>
  <script type="module" src="assets/js/logomodule.js"></script>
  <script type="module" src="assets/js/stati.js"></script>
</body>
</html>
